 const c=tasks.filter(x=>x.status==="completed").length,S=[["total",tasks.length,"blue","list-check"],["done",c,"emerald","circle-check"],["pending",tasks.length-c,"amber","clock"],["streak",streak()+" "+t("days")+" 🔥","purple","fire"]];
 $("stats").innerHTML=S.map(s=>`<div class="card p-5 shadow-sm flex items-center justify-between"><div><span class="text-slate-400 text-sm">${t(s[0])}</span><h3 class="text-2xl font-bold mt-1 text-${s[2]}-500">${s[1]}</h3></div><div class="w-12 h-12 rounded-xl bg-${s[2]}-500/10 text-${s[2]}-500 flex items-center justify-center text-xl"><i class="fa-solid fa-${s[3]}"></i></div></div>`).join("");
 const r=tasks.length?Math.round(c/tasks.length*100):0;$("rate").textContent=t("rate")+r+"%";
}
function chart(id,type,data,opts){if(charts[id]){charts[id].data=data;charts[id].update()}else charts[id]=new Chart($(id),{type,data,options:Object.assign({responsive:true,maintainAspectRatio:false},opts||{})})}
function renderCharts(){
 const n=new Date(),ms=[5,4,3,2,1,0].map(i=>new Date(n.getFullYear(),n.getMonth()-i,1));
 chart("c-month","line",{labels:ms.map(d=>d.toLocaleDateString(L(),{month:"short"})),datasets:[{label:t("done"),data:ms.map(d=>tasks.filter(x=>x.status==="completed"&&x.date.slice(0,7)===iso(d).slice(0,7)).length),borderColor:"#8b5cf6",backgroundColor:"rgba(139,92,246,.12)",fill:true,tension:.4}]},{scales:{y:{beginAtZero:true,ticks:{precision:0}}}});
 const P=["High","Medium","Low"];chart("c-pri","doughnut",{labels:P.map(p=>t("pri_"+p)),datasets:[{data:P.map(p=>tasks.filter(x=>x.priority===p).length),backgroundColor:["#ef4444","#f59e0b","#10b981"],borderWidth:0}]});
 const C=["Study","Work","Personal","Health"];chart("c-cat","bar",{labels:C.map(c=>t("cat_"+c)),datasets:[{label:t("total"),data:C.map(c=>tasks.filter(x=>x.category===c).length),backgroundColor:"#8b5cf6"},{label:t("done"),data:C.map(c=>tasks.filter(x=>x.category===c&&x.status==="completed").length),backgroundColor:"#10b981"}]},{scales:{y:{beginAtZero:true,ticks:{precision:0}}}});
}
function renderCal(){
 const y=cal.getFullYear(),m=cal.getMonth();$("cal-title").textContent=cal.toLocaleDateString(L(),{month:"long",year:"numeric"});
 let h="";for(let i=0;i<7;i++)h+=`<div class="text-xs text-slate-400 py-1">${new Date(2023,0,1+i).toLocaleDateString(L(),{weekday:"short"})}</div>`;
 for(let i=0;i<new Date(y,m,1).getDay();i++)h+="<div></div>";
 for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const ds=iso(new Date(y,m,d)),c=tasks.filter(x=>x.date===ds).length;h+=`<button class="day ${ds===sel?"act":""} ${ds===today()?"today":""}" onclick="W.day('${ds}')"><b>${d}</b>${c?`<i class="dot"></i>`:""}</button>`}
 $("cal-grid").innerHTML=h;const ds=sel||today(),L2=tasks.filter(x=>x.date===ds);
 $("day-title").textContent=new Date(ds+"T00:00").toLocaleDateString(L(),{weekday:"long",day:"numeric",month:"long"});
 $("day-list").innerHTML=L2.length?L2.map(x=>`<div class="flex justify-between p-3 rounded-xl bg-slate-100 dark:bg-slate-800/50"><span class="${x.status==="completed"?"line-through opacity-60":""}">${esc(x.title)}${x.time?" · "+x.time:""}</span><span class="text-xs text-slate-400">${t("st_"+x.status)}</span></div>`).join(""):`<p class="text-slate-400">${t("no_day")}</p>`}

function setProfile(u){const n=u.displayName||u.email.split("@")[0];$("uname").textContent=n;$("uemail").textContent=u.email;$("s-name").value=u.displayName||"";$("s-avatar").value=u.photoURL||"";const a=$("avatar");a.style.backgroundImage=u.photoURL?`url("${u.photoURL}")`:"";a.textContent=u.photoURL?"":n.charAt(0).toUpperCase()}
const errMsg=e=>({"auth/invalid-credential":"e_cred","auth/wrong-password":"e_cred","auth/user-not-found":"e_cred","auth/email-already-in-use":"e_used","auth/weak-password":"e_weak","auth/invalid-email":"e_mail","auth/network-request-failed":"e_net"}[e.code]||"e_gen");
const col=()=>collection(db,"users",auth.currentUser.uid,"tasks");

if(ok)onAuthStateChanged(auth,u=>{
 if(unsub){unsub();unsub=null}
 if(u){$("auth").classList.add("hidden");$("app").classList.remove("hidden");setProfile(u);loaded=false;renderAll();
  unsub=onSnapshot(col(),s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));loaded=true;renderAll()},()=>toast(t("e_gen"),1))}
 else{tasks=[];$("app").classList.add("hidden");$("auth").classList.remove("hidden")}});

const W=window.W={
 mode(m){mode=m;$("a-name").classList.toggle("hidden",m!=="register");$("tab-login").classList.toggle("act",m==="login");$("tab-register").classList.toggle("act",m==="register");$("a-err").classList.add("hidden");$("a-btn").textContent=t(m)},
 async auth(e){e.preventDefault();if(!ok)return toast(t("cfg_warn"),1);const b=$("a-btn"),em=$("a-email").value.trim(),pw=$("a-pass").value;b.disabled=true;$("a-err").classList.add("hidden");
  try{if(mode==="login")await signInWithEmailAndPassword(auth,em,pw);else{const c=await createUserWithEmailAndPassword(auth,em,pw);const n=$("a-name").value.trim();if(n){await updateProfile(c.user,{displayName:n});setProfile(auth.currentUser)}}}
  catch(x){$("a-err").textContent=t(errMsg(x));$("a-err").classList.remove("hidden")}b.disabled=false},
 async google(){if(!ok)return toast(t("cfg_warn"),1);try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){if(x.code!=="auth/popup-closed-by-user")toast(t(errMsg(x)),1)}},
 async reset(){if(!ok)return toast(t("cfg_warn"),1);const em=$("a-email").value.trim();if(!em)return toast(t("need_email"),1);try{await sendPasswordResetEmail(auth,em);toast(t("reset_sent"))}catch(x){toast(t(errMsg(x)),1)}},
 logout(){signOut(auth)},
 tab(id){tabId=id;["dashboard","tasks","calendar","analytics","settings"].forEach(k=>$("v-"+k).classList.toggle("hidden",k!==id));$$(".nav[data-tab]").forEach(b=>b.classList.toggle("act",b.dataset.tab===id));$("page-title").textContent=t("nav_"+id);
  const s=$("side");if(!s.classList.contains("md:flex")||s.classList.contains("fixed"))W.menu(true);Object.values(charts).forEach(c=>c.resize())},
 menu(close){const s=$("side"),open=s.classList.contains("fixed");if(close===true&&!open)return;["hidden","fixed","inset-y-0","z-40","shadow-2xl"].forEach(c=>s.classList.toggle(c));s.classList.toggle("end-0",!open)},
 lang(){lang=lang==="ar"?"en":"ar";localStorage.lang=lang;renderAll();W.mode(mode)},
 theme(){dark=!dark;localStorage.theme=dark?"dark":"light";renderAll()},
 search(v){q=v;if(tabId!=="tasks")W.tab("tasks");renderTasks()},
 filter(c){filter=c;renderFilters();renderTasks()},
 open(id){const x=tasks.find(k=>k.id===id)||{};$("t-id").value=id||"";$("m-title").textContent=t(id?"m_edit":"m_add");$("t-title").value=x.title||"";$("t-cat").value=x.category||"Study";$("t-pri").value=x.priority||"Medium";$("t-date").value=x.date||today();$("t-time").value=x.time||"";$("modal").classList.replace("hidden","flex");$("t-title").focus()},
 close(){$("modal").classList.replace("flex","hidden")},
 async save(){const title=$("t-title").value.trim();if(!title)return toast(t("need_title"),1);const id=$("t-id").value,d={title,category:$("t-cat").value,priority:$("t-pri").value,date:$("t-date").value||today(),time:$("t-time").value},b=$("t-save");b.disabled=true;
  try{if(id){await updateDoc(doc(col(),id),d);toast(t("task_updated"))}else{await addDoc(col(),{...d,status:"pending",completedAt:null,createdAt:serverTimestamp()});toast(t("task_added"))}W.close()}catch(x){toast(t("e_gen"),1)}b.disabled=false},
 async toggle(id){const x=tasks.find(k=>k.id===id),c=x.status==="completed";try{await updateDoc(doc(col(),id),{status:c?"pending":"completed",completedAt:c?null:today()})}catch(e){toast(t("e_gen"),1)}},
 async del(id){if(!confirm(t("del_confirm")))return;try{await deleteDoc(doc(col(),id));toast(t("task_deleted"))}catch(e){toast(t("e_gen"),1)}},
 month(n){cal=new Date(cal.getFullYear(),cal.getMonth()+n,1);renderCal()},
 day(ds){sel=ds;renderCal()},
 async saveProfile(){try{await updateProfile(auth.currentUser,{displayName:$("s-name").value.trim()||null,photoURL:$("s-avatar").value.trim()||null});setProfile(auth.currentUser);toast(t("saved"))}catch(e){toast(t("e_gen"),1)}}
};
document.addEventListener("keydown",e=>{if(e.key==="Escape")W.close()});
if(!ok)$("cfg-warn").classList.remove("hidden");
applyStatic();
</script>
</body>
</html>
